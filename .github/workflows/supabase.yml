# Applique les migrations et le catalogue (seed) sur le projet Supabase de production
# à chaque push sur main qui modifie la base. Le front reste déployé par Netlify.
#
# Secrets GitHub à créer (Settings > Secrets and variables > Actions) :
#   SUPABASE_ACCESS_TOKEN  jeton personnel (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_ID    référence du projet (Project Settings > General)
#   SUPABASE_DB_PASSWORD   mot de passe de la base (choisi à la création du projet)
#   SUPABASE_DB_URL        chaîne de connexion « Session pooler » (bouton Connect du dashboard),
#                          avec le mot de passe à la place de [YOUR-PASSWORD]
name: Base de données

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.33.9

      - name: Lier le projet
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Appliquer les migrations
        run: supabase db push

      # Le seed est idempotent : il met à jour les cartes et le contenu des albums.
      # Il est rejoué à chaque fois avec psql : `db push --include-seed` ne l'applique
      # qu'une seule fois et ignore ensuite ses modifications.
      - name: Appliquer le catalogue
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q -f supabase/seed.sql

      # Calendrier et résultats des courses (pronostics), ensuite tenus à jour par races.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchroniser les courses
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node scripts/sync-races.mjs > races.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f races.sql
